[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-signal-agent"
version = "0.1.0"
description = "Production-grade AI signal-only trading agent for stocks and crypto"
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Data & numerics
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    # Market data — stocks
    "alpaca-py>=0.20",
    # Market data — crypto
    "python-binance>=1.0",
    "websockets>=12.0",
    # Technical analysis
    "pandas-ta>=0.3.14b",
    # Async
    "anyio>=4.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # Storage
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Scheduling
    "apscheduler>=3.10",
    # Utils
    "tabulate>=0.9",
    "rich>=13.7",
    "typer>=0.12",
    "orjson>=3.10",
    "greenlet>=3.4.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "jinja2>=3.1.6",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
